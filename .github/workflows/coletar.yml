name: Coletar preços

on:
  schedule:
    - cron: '15 12 * * *'   # todo dia às 09:15 de Brasília (12:15 UTC)
  workflow_dispatch:
    inputs:
      todas:
        description: 'Buscar as 24 datas de uma vez (gasta 24 buscas do plano grátis)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar preços no SerpApi
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TODAS_AS_DATAS: ${{ inputs.todas }}
        run: node scripts/coletar.mjs

      - name: Salvar histórico
        run: |
          git config user.name "monitor-passagens"
          git config user.email "monitor-passagens@users.noreply.github.com"
          git add data/historico.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Preços de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push
          fi

      - name: Avisar por e-mail se o preço caiu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s data/alerta.txt ]; then
            gh issue create --title "$(cat data/alerta.txt | cut -c1-200)" \
              --body "$(cat data/alerta.txt)

          Veja o site: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          else
            echo "Nenhuma queda de preço."
          fi
