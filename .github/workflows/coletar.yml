name: Coletar preços

on:
  schedule:
    - cron: '15 12 * * *'   # todo dia às 09:15 de Brasília (12:15 UTC)
  workflow_dispatch:
    inputs:
      todas:
        description: 'Buscar todas as datas à venda de uma vez (gasta mais buscas do plano grátis)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Buscar preços e mandar o resumo no WhatsApp
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          WHATSAPP_DESTINOS: ${{ secrets.WHATSAPP_DESTINOS }}
          TODAS_AS_DATAS: ${{ inputs.todas }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/coletar.mjs

      - name: Salvar histórico
        run: |
          git config user.name "monitor-passagens"
          git config user.email "monitor-passagens@users.noreply.github.com"
          git add data/historico.json data/sites.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Preços de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push
          fi
